<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoek een lokaal | HAN Campus Arnhem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-title="Zoek een lokaal">
  <div class="map-bg" aria-hidden="true"></div>
  <div class="map-overlay" aria-hidden="true"></div>
  <div id="header-slot"></div>
  <main class="page-main">
    <header class="page-hero">
      <nav class="crumb"><a href="/index.html">Home</a><span>›</span><span>Zoek een lokaal</span></nav>
      <h1>Zoek een lokaal</h1>
    </header>
    <section class="panel">
      <div class="accent-bar accent-navy"></div>
      <p>Lokalen zijn opgebouwd als <strong>gebouw + verdieping + nummer</strong>. R31.2.10 = gebouw R31 (Ruitenberglaan 31), verdieping 2, ruimte 10.</p>
      <form class="search-box" id="room-form">
        <input id="room-q" placeholder="Typ een lokaal, bijv. R26.1.08" />
        <button type="submit">Zoek</button>
      </form>
      <div class="result-list" id="room-out"></div>
    </section>
    <script type="module">
      const rooms = {
        "r31.2.10": "Gebouw R31 (Ruitenberglaan 31), 2e verdieping. Via de Hangar-entree, trap of lift naar 2.",
        "r27.1.04": "Gebouw R27, 1e verdieping. Dicht bij het studiecentrum/multimedia.",
        "r29.0.12": "Gebouw R29, begane grond. Centrale gang, volg de bewegwijzering.",
        "r26.3.21": "Gebouw R26, 3e verdieping. Engineering & Automotive-vleugel, lift in de hal.",
        "r26.1.08": "Gebouw R26, 1e verdieping. Richting Ruitenberglaan-zijde / labs."
      };
      document.getElementById("room-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const q = document.getElementById("room-q").value.trim().toLowerCase().replace(/\s/g,"");
        const hit = rooms[q];
        document.getElementById("room-out").innerHTML = hit
          ? '<div class="result-item"><span>'+q.toUpperCase()+' — '+hit+'</span></div>'
          : '<div class="result-item"><span>Geen exacte match. Probeer R31.2.10, R27.1.04, R29.0.12, R26.3.21 of R26.1.08. Of open Gebouwen.</span></div>';
      });
    </script>
  </main>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
